events {}

http {
    ssl_certificate     /tls/server.pem;
    ssl_certificate_key /tls/server.key;
    resolver 127.0.0.11 valid=10s;

    upstream controllers {
        zone controllers 64k;
        server controller-1:8082 resolve;
        server controller-2:8082 resolve;
    }

    server {
        listen 9443 ssl;
        location / {
            proxy_pass http://controllers;
            proxy_connect_timeout 2s;
        }
    }
}
