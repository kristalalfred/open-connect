name: open-connect

x-connect: &connect
  image: ${CONNECT_IMAGE:-ghcr.io/kristalalfred/open-connect:latest}
  restart: unless-stopped

x-controller: &controller
  <<: *connect
  command: ["connect-controller"]
  environment: &controller-environment
    CONNECT_CONTROLLER_ADDR: 0.0.0.0:8082
    CONNECT_DASHBOARD_ADDR: 0.0.0.0:8090
    DATABASE_URL: postgres://connect:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/connect
    CONNECT_NORTHBOUND_TOKEN: ${CONNECT_NORTHBOUND_TOKEN:?set CONNECT_NORTHBOUND_TOKEN}
    CONNECT_SOUTHBOUND_KEY: ${CONNECT_SOUTHBOUND_KEY:?set CONNECT_SOUTHBOUND_KEY}
    CONNECT_SOUTHBOUND_MIN_EPOCHS: ${CONNECT_SOUTHBOUND_MIN_EPOCHS:-}
    CONNECT_SRT_KEY_SECRET: ${CONNECT_SRT_KEY_SECRET:?set CONNECT_SRT_KEY_SECRET}
    CONNECT_CORS_ORIGIN: ${CONNECT_CORS_ORIGIN:-}
  depends_on:
    postgres:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "curl", "-sf", "http://127.0.0.1:8082/health"]
    interval: 5s
    timeout: 3s
    retries: 10
    start_period: 5s

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: connect
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: connect
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U connect -d connect"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  controller-1:
    <<: *controller
    environment:
      <<: *controller-environment
      CONNECT_ADVERTISE_URL: http://controller-1:8082
    ports:
      - "127.0.0.1:8090:8090"

  controller-2:
    <<: *controller
    environment:
      <<: *controller-environment
      CONNECT_ADVERTISE_URL: http://controller-2:8082
    ports:
      - "127.0.0.1:8091:8090"

  tls:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./tls:/tls:ro
    ports:
      - "443:9443"
    depends_on:
      controller-1:
        condition: service_healthy
      controller-2:
        condition: service_healthy

volumes:
  pgdata:
