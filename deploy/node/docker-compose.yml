name: open-connect-node

services:
  strom:
    image: eyevinntechnology/strom:0.6.10
    restart: unless-stopped
    network_mode: host
    environment:
      STROM_PORT: "8080"
      STROM_DATA_DIR: /data
      STROM_API_KEY: ${STROM_API_KEY:?set STROM_API_KEY}
    volumes:
      - strom-data:/data
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  adapter:
    image: ${CONNECT_IMAGE:-ghcr.io/kristalalfred/open-connect:latest}
    restart: unless-stopped
    network_mode: host
    command: ["connect-adapter-strom", "--config", "/etc/connect/node.yaml"]
    environment:
      CONNECT_SOUTHBOUND_TOKEN: ${CONNECT_SOUTHBOUND_TOKEN:?set CONNECT_SOUTHBOUND_TOKEN}
      CONNECT_STROM_TOKEN: ${STROM_API_KEY:?set STROM_API_KEY}
    volumes:
      - ./node.yaml:/etc/connect/node.yaml:ro
    depends_on:
      strom:
        condition: service_healthy

volumes:
  strom-data:
