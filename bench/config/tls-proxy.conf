events {}

http {
    ssl_certificate     /tls/server.pem;
    ssl_certificate_key /tls/server.key;

    upstream controllers {
        server 10.97.25.22:8082;
        server 10.97.25.24:8082;
    }

    server {
        listen 9443 ssl;
        listen 9080;
        location / {
            proxy_pass http://controllers;
            proxy_connect_timeout 2s;
        }
    }
}
